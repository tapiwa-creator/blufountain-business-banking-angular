<main class="page-container">
    <section class="container header-section">
        <div>
            <h1 class="font-outfit page-title">Trade Collections</h1>
            <p class="page-subtitle">Manage payment obligations efficiently and securely across borders.</p>
        </div>
        <button class="action-btn primary">Initiate Collection</button>
    </section>

    <section class="container layout-with-sidebar">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-nav">
            <h3 class="font-outfit sidebar-title">Collection Methods</h3>
            <ul class="nav-list">
                <li *ngFor="let tab of tabs" 
                    [class.active]="activeTab === tab"
                    (click)="setActiveTab(tab)">
                    {{ tab }}
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="content-card">
                <div class="card-header">
                    <h2 class="font-outfit">{{ activeTab }}</h2>
                </div>
                
                <div class="card-body" [ngSwitch]="activeTab">
                    
                    <div *ngSwitchDefault class="placeholder-content">
                        <div class="icon-wrapper"><i class="icon-trend"></i></div>
                        <h3 class="font-outfit">{{ activeTab }} Processing</h3>
                        <p>Track statuses and communicate with correspondent banks globally for your trade settlements.</p>
                        
                        <div style="display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: center;">
                            <button class="btn btn-gold">View Active Ledger</button>
                            <button class="btn btn-outline">Generate Summary</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</main>
