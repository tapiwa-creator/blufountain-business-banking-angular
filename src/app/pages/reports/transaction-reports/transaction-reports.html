<main class="page-container">
    <section class="container header-section">
        <div>
            <h1 class="font-outfit page-title">Transaction Reports</h1>
            <p class="page-subtitle">Detailed audit logs and activity reports for your business accounts.</p>
        </div>
        <button class="action-btn primary">Export All Data</button>
    </section>

    <section class="container layout-with-sidebar">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-nav">
            <h3 class="font-outfit sidebar-title">Audit Logs</h3>
            <ul class="nav-list">
                <li *ngFor="let tab of tabs" 
                    [class.active]="activeTab === tab"
                    (click)="setActiveTab(tab)">
                    {{ tab }}
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="content-card">
                <div class="card-header">
                    <h2 class="font-outfit">{{ activeTab }}</h2>
                </div>
                
                <div class="card-body" [ngSwitch]="activeTab">
                    
                    <div *ngSwitchDefault class="placeholder-content">
                        <div class="icon-wrapper"><i class="icon-list"></i></div>
                        <h3 class="font-outfit">{{ activeTab }} Search</h3>
                        <p>Filter and search through your {{ activeTab.toLowerCase() }} using advanced search parameters and export for reconciliation.</p>
                        
                        <div class="form-container" style="text-align: left; margin-top: 1.5rem; width: 100%;">
                            <div class="form-group">
                                <label>Search Reference</label>
                                <input type="text" class="form-control" placeholder="Search by name, reference or amount...">
                            </div>
                            <button class="btn btn-gold full-width">Search & Filter</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</main>
