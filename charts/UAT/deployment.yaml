apiVersion: apps/v1
kind: Deployment
metadata:
  name: blufountain-business-banking-angular-deployment
  namespace: blufountain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blufountain-business-banking-angular
  template:
    metadata:
      labels:
        app: blufountain-business-banking-angular
    spec:
      containers:
        - name: blufountain-business-banking-angular-container
          image: kaributechsworkflow/blufountain-business-banking-angular:56ad7cd634d100c70db17cee4d8311781416abcc
          ports:
            - containerPort: 8443
          env:
            - name: PORT
              value: "8443"
