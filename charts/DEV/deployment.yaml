apiVersion: apps/v1
kind: Deployment
metadata:
  name: blufountain-business-banking-angular-deployment
  namespace: blufountain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blufountain-business-banking-angular
  template:
    metadata:
      labels:
        app: blufountain-business-banking-angular
    spec:
      containers:
        - name: blufountain-business-banking-angular-container
          image: kaributechsworkflow/blufountain-business-banking-angular:0c29f154290449a5b60c14ed95660577a33a76b7
          ports:
            - containerPort: 8443
          env:
            - name: PORT
              value: "8443"
