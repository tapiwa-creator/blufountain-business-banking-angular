# nginx.conf

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Note: We use standard headers here to avoid dependency 
    # on external modules that can crash Alpine containers.
    
    server {
        # 1. Listen on Port 3050 (HTTP)
        listen 3050;
        server_name localhost;

        # 2. Point to where we copied the React build
        root /usr/share/nginx/html;
        index index.html;

        # Load the proxy rules
        include /etc/nginx/conf.d/nginx.common;
        
        # 3. React Router Fix:
        # If the user asks for /dashboard, serve index.html so React can handle it
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 4. Security Headers (Standard Nginx)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Health check endpoint (Useful for Kubernetes/Argo)
        location /health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }
}
